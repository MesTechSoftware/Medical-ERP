name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dal için üst üste gelen koşuları iptal et.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI'da hem uygulama hem e2e aynı PostgreSQL servisini kullanır.
  DATABASE_URL: postgresql://medikal:medikal_dev@localhost:5432/medikal_dev?schema=public
  TEST_DATABASE_URL: postgresql://medikal:medikal_dev@localhost:5432/medikal_test?schema=public
  ITEST_DATABASE_URL: postgresql://medikal:medikal_dev@localhost:5432/medikal_itest?schema=public
  # E-1 §(2): uygulama ve testler UTC çalışır; makinenin dilimi hiçbir yerde belirleyici değildir.
  TZ: UTC

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medikal
          POSTGRES_PASSWORD: medikal_dev
          POSTGRES_DB: medikal_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medikal -d medikal_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Prisma client src/generated/prisma'ya üretilir ve GITIGNORED'dır;
      # typecheck ve build'den ÖNCE üretilmek zorunda.
      - name: Prisma client üret
        run: npx prisma generate

      # docker/init-test-db.sql yalnız yerel container'ın ilk kurulumunda
      # çalışır; CI servisinde veritabanları burada açılır.
      - name: Test veritabanlarını oluştur
        run: |
          PGPASSWORD=medikal_dev psql -h localhost -U medikal -d medikal_dev \
            -c 'CREATE DATABASE medikal_test OWNER medikal;' \
            -c 'CREATE DATABASE medikal_itest OWNER medikal;'

      - name: Migrasyonları uygula
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Birim testler
        run: npm test

      # Entegrasyon şeridi kendi veritabanını (medikal_itest) kullanır ve
      # şemayı globalSetup'ta uygular; ayrı bir migrate adımı gerekmez.
      - name: Entegrasyon testler
        run: npm run test:integration

      - name: Playwright tarayıcılarını kur
        run: npx playwright install --with-deps chromium webkit

      - name: E2E testler
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
